# Fly.io — REDESIM Manager (regiao Sao Paulo)
# O nome do app precisa bater com o app criado no Fly (fly launch / dashboard).
app = "redesim-csm"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8501
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "40s"
    method = "GET"
    path = "/_stcore/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
