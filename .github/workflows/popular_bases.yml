# =====================================================================
# REDESIM Manager — Popular bases no Supabase (botão "Run workflow")
# =====================================================================
# Roda os 3 scripts auxiliares de uma vez, no Cloud, com acesso ao
# Supabase via DATABASE_URL nos Secrets. Substitui o "abrir PowerShell
# e rodar python".
#
# COMO USAR:
#   1. Abrir https://github.com/Viniciusrqv/redesim-manager/actions
#   2. Clicar no workflow "Popular bases (órgãos + regras + cleanup)"
#   3. Botão "Run workflow" no canto direito → "Run workflow"
#   4. Aguardar ~30s — em verde, deu certo.
# =====================================================================
name: Popular bases (órgãos + regras + cleanup)

on:
  workflow_dispatch:
    inputs:
      rodar_orgaos:
        description: "Popular catálogo de órgãos oficiais"
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      rodar_regras:
        description: "Popular regras-seed (CRECI, CRM, etc)"
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      rodar_cleanup:
        description: "Fechar protocolos REDESIM órfãos"
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  popular:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependências mínimas
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv unidecode

      - name: Validar acesso ao Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ ERRO: secret DATABASE_URL NÃO está configurado no GitHub."
            echo ""
            echo "Vá em:"
            echo "https://github.com/Viniciusrqv/redesim-manager/settings/secrets/actions"
            echo ""
            echo "Clique em 'New repository secret' e adicione:"
            echo "  Name:  DATABASE_URL"
            echo "  Value: (a connection string completa do Supabase Pooler)"
            echo ""
            exit 1
          fi
          # Mostra só o prefixo (não vaza credencial)
          PREFIX=$(echo "$DATABASE_URL" | cut -c1-30)
          echo "✓ DATABASE_URL configurado (prefixo: ${PREFIX}...)"
          # Testa conexão real
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'], connect_timeout=10)
          cur = conn.cursor()
          cur.execute('SELECT current_database(), current_user')
          db, user = cur.fetchone()
          print(f'✓ Conectado ao Postgres: db={db} user={user}')
          conn.close()
          "

      - name: Popular catálogo de órgãos oficiais
        if: ${{ inputs.rodar_orgaos == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=========================================="
          echo "  Catalogando órgãos oficiais"
          echo "=========================================="
          python popular_orgaos_oficiais.py

      - name: Popular regras oficiais (CRECI, CRM, etc)
        if: ${{ inputs.rodar_regras == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=========================================="
          echo "  Populando regras-seed"
          echo "=========================================="
          python popular_regras_oficiais.py

      - name: Fechar protocolos REDESIM órfãos
        if: ${{ inputs.rodar_cleanup == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=========================================="
          echo "  Limpando protocolos órfãos"
          echo "=========================================="
          python fechar_protocolos_orfaos.py

      - name: Resumo
        run: |
          echo "=========================================="
          echo "  ✅ Concluído"
          echo "=========================================="
          echo "Recarregue o app: https://redesim-csm.streamlit.app"
