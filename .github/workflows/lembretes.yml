# =====================================================================
# REDESIM Manager — Lembretes diários via Telegram
# =====================================================================
# Roda 2x por dia (10:00 e 15:00 BRT = UTC-3) checando:
#   - Processos parados
#   - Protocolos REDESIM em andamento
#   - Documentos com vencimento próximo (45d)
#   - Alvarás AVCB/CLCB vencendo (60d)
#   - Pendências gerais
# E manda tudo via Telegram pro chat configurado.
#
# Pra reativar/ajustar horários, edita só este arquivo e dá push.
# Pra rodar AGORA (teste manual): GitHub → Actions → "Lembretes
# diários (Telegram)" → "Run workflow".
# =====================================================================
name: Lembretes diários (Telegram)

on:
  schedule:
    # GitHub Actions usa UTC. Brasília = UTC-3.
    # 10:00 BRT = 13:00 UTC
    - cron: '0 13 * * *'
    # 15:00 BRT = 18:00 UTC
    - cron: '0 18 * * *'
  # Permite rodar manualmente pela aba Actions do GitHub
  workflow_dispatch:

jobs:
  enviar-lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependências mínimas
        run: |
          python -m pip install --upgrade pip
          # Só o necessário pra rodar os checks + Telegram (não instala
          # streamlit, pandas, playwright — não precisa).
          pip install psycopg2-binary requests python-dateutil
          pip install python-dotenv unidecode schedule

      - name: Rodar checks e enviar alertas
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAS_AMARELO: '3'
          DIAS_VERMELHO: '4'
          # Avisa que está rodando em modo "uma execução só" (não scheduler local)
          REDESIM_MODO_BATCH: '1'
        working-directory: redesim_manager
        run: |
          echo "=========================================="
          echo "  REDESIM Manager — Lembretes via Telegram"
          echo "  $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "=========================================="
          python rodar_alertas_agora.py
